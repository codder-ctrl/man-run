<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Man Run icons</title>
<style>
  body { margin: 16px; background: #2a1b17; color: #fff8e6; font: 14px sans-serif; }
  canvas { margin: 6px; vertical-align: top; background: repeating-conic-gradient(#ccc 0 25%, #eee 0 50%) 0 0 / 16px 16px; }
</style>
</head>
<body>
<p id="status">Çiziliyor…</p>
<script type="module">
// Draws the app icons with the game's vector art and posts them to tools/icon-server.js.
import { drawAnimal, poseFor } from '../js/animals.js';
import { blob, glow, flat, circle, roundRect, INK } from '../js/paint.js';

// The icon scene in a 100-unit square: sky, sun, a grass strip and the fox mid-stride.
function scene(g, k = 1) {
  const sky = g.createLinearGradient(0, 0, 0, 100);
  sky.addColorStop(0, '#4fa8e8');
  sky.addColorStop(1, '#d8f2f4');
  g.fillStyle = sky;
  g.fillRect(0, 0, 100, 100);
  glow(g, 80, 20, 28, '#fff4c0', 0.7);
  flat(g, circle(80, 20, 8), '#fff4c0');
  blob(g, roundRect(-10, 80, 120, 40, 4), '#6cc04a', { ow: 1.4, depth: 3, shade: '#479a34', light: '#a8e27a' });
  g.save();
  g.translate(48, 84);
  g.scale(1.25 * k, 1.25 * k);
  drawAnimal(g, 'fox', poseFor({ id: 0, vx: 300, grounded: true, runPhase: 0.1, boost: 1 }, 0.3), 0.3);
  g.restore();
}

function make(size, { pad = 0, round = 0, k = 1 } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.scale(size / 100, size / 100);
  if (round) {
    g.save();
    g.beginPath();
    roundRect(pad, pad, 100 - pad * 2, 100 - pad * 2, round)(g);
    g.clip();
    g.translate(pad, pad);
    g.scale((100 - pad * 2) / 100, (100 - pad * 2) / 100);
    scene(g, k);
    g.restore();
    g.beginPath();
    roundRect(pad, pad, 100 - pad * 2, 100 - pad * 2, round)(g);
    g.lineWidth = 3;
    g.strokeStyle = INK;
    g.stroke();
  } else scene(g, k);
  return c;
}

const icons = {
  'icon-192.png': make(192, { pad: 3, round: 20 }),
  'icon-512.png': make(512, { pad: 3, round: 20 }),
  'icon-maskable-512.png': make(512, { k: 0.8 }),
  'apple-touch-icon.png': make(180),
  'favicon-32.png': make(32, { round: 18, k: 1.1 }),
};
const status = document.getElementById('status');
for (const [name, c] of Object.entries(icons)) {
  document.body.appendChild(c);
  const blobData = await new Promise((r) => c.toBlob(r, 'image/png'));
  const res = await fetch('/save?name=' + name, { method: 'POST', body: blobData }).catch(() => null);
  status.textContent = res && res.ok ? 'Yazıldı: ' + name : 'Sunucu yok (önizleme): ' + name;
}
</script>
</body>
</html>
