<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Man Run key art</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #2a1b17; color: #fff8e6; font: 14px sans-serif; }
  canvas { display: block; width: 100%; height: auto; }
  #status { position: fixed; left: 8px; top: 8px; background: rgba(0, 0, 0, 0.5); padding: 4px 8px; }
</style>
</head>
<body>
<p id="status">Çiziliyor…</p>
<script type="module">
// Paints the key art with tools/splash.js and posts it to tools/icon-server.js (`node
// tools/icon-server.js splash`): img/splash.webp (loading screen) and img/menu-bg.webp (menu).
import { paintSplash, W, H } from './splash.js';

await document.fonts.load('300px "Lilita One"');
const status = document.getElementById('status');
const make = (opts) => { const c = document.createElement('canvas'); c.width = W; c.height = H; paintSplash(c, opts); return c; };
const scaled = (src, w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, w, h); return c; };

const splash = make();
document.body.appendChild(splash);
const menu = scaled(make({ logo: false, cast: false }), 1920, 960);
document.body.appendChild(menu);
window.art = { splash, menu };

const files = { 'splash.webp': [splash, 0.9], 'menu-bg.webp': [menu, 0.84] };
for (const [name, [c, q]] of Object.entries(files)) {
  const data = await new Promise((r) => c.toBlob(r, 'image/webp', q));
  const res = await fetch('/save?name=' + name, { method: 'POST', body: data }).catch(() => null);
  status.textContent = (res && res.ok ? 'Yazıldı: ' : 'Sunucu yok (önizleme): ') + name + ` (${Math.round(data.size / 1024)} KB)`;
}
</script>
</body>
</html>
